<script>
const G_OUT = "#7A6E5E", G_TAN = "#CDB894", G_MUZ = "#EADCC0", G_INN = "#B39A74", G_SW = 2.6;
const OBANG = {
blue: { name: '푸른', robe: '#2F62B0', dark: '#1E4380', lite: '#8FB2E6', card: '#E3ECFA' },
red: { name: '붉은', robe: '#C8323A', dark: '#8E1E24', lite: '#F2A0A4', card: '#FBE4E4' },
yel: { name: '황금',
robe: '#E0AE2C', dark: '#9A740E', lite: '#F6DB8A', card: '#FBF1D2' },
white: { name: '흰', robe: '#F6F3EA', dark: '#A89E88', lite: '#FFFFFF', card: '#FFFFFF' },
black: { name: '검은', robe: '#33333D', dark: '#15151B', lite: '#6A6A78', card: '#E6E6EC' },
};
function gomHead(o = {}) {
let g = '';
if (o.ears !== false) g += `<circle cx="-20" cy="-112" r="9" fill="${G_TAN}" stroke="${G_OUT}" stroke-width="${G_SW}"/><circle cx="20" cy="-112" r="9" fill="${G_TAN}" stroke="${G_OUT}" stroke-width="${G_SW}"/>`
+ `<circle cx="-20" cy="-112" r="4.5" fill="${G_INN}"/><circle cx="20" cy="-112" r="4.5" fill="${G_INN}"/>`;
g += `<ellipse cx="0" cy="-93" rx="27" ry="25" fill="${G_TAN}" stroke="${G_OUT}" stroke-width="${G_SW}"/>`;
return g;
}
function gomFace(o = {}) {
const BR = '#5A3A26';
let g = `<path d="M-6.5,-105.5 Q-10,-107 -14,-103.5 M6.5,-105.5 Q10,-107 14,-103.5" stroke="${BR}" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
if ((o.eyes || 'open') === 'open') g += `<circle cx="-9.5" cy="-97.5" r="2.5" fill="#2A1A10"/><circle cx="9.5" cy="-97.5" r="2.5" fill="#2A1A10"/>`;
else g += `<path d="M-13,-97 q3.5,3 7,0 M6,-97 q3.5,3 7,0" stroke="#2A1A10" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
g += `<path d="M-4.6,-92 L4.6,-92 L0,-86.6Z" fill="${BR}" stroke="${BR}" stroke-width="1.6" stroke-linejoin="round"/>`;
if (o.mouth === 'o') g += `<path d="M0,-86.5 V-83" stroke="${BR}" stroke-width="1.6"/><ellipse cx="0" cy="-79" rx="4" ry="4.5" fill="#7A2A2A"/>`;
else g += `<path d="M0,-86.5 V-82.5 C-3,-77.5 -10,-77 -14.5,-81.5 C-16.5,-83.5 -15.5,-86.5 -13,-86 M0,-82.5 C3,-77.5 10,-77 14.5,-81.5 C16.5,-83.5 15.5,-86.5 13,-86" stroke="${BR}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
g += `<g fill="${BR}">` + [[-17, -92], [-20.5, -90], [-17.5, -88.3]].map(([a, b]) => `<circle cx="${a}" cy="${b}" r="0.95"/><circle cx="${-a}" cy="${b}" r="0.95"/>`).join('') + `</g>`;
return g;
}
const gArm = (d, col, w = 15) => `<path d="${d}" stroke="${G_OUT}" stroke-width="${w + G_SW * 2}" fill="none" stroke-linecap="round"/><path d="${d}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
const gPaw = (a, b, col = G_TAN) => `<circle cx="${a}" cy="${b}" r="6.5" fill="${col}" stroke="${G_OUT}" stroke-width="2"/>`;
function gomArms(md, col, cuff, T) {
const wv = Math.sin(T * 14) * 3;
if (md === 'up') return { back: gArm(`M-20,-66 Q-34,-84 ${-30 + wv},-102`, col) + gArm(`M20,-66 Q34,-84 ${30 - wv},-102`, col) + gPaw(-30 + wv, -106, cuff) + gPaw(30 - wv, -106, cuff), front: '' };
if (md === 'hold') return { back: gArm('M-20,-66 Q-32,-92 -20,-118', col) + gArm('M20,-66 Q32,-92 20,-118', col), front: '', paws: gPaw(-20, -121, cuff) + gPaw(20, -121, cuff) };
if (md === 'point') return { back: gArm(`M20,-66 Q40,-78 ${46 + wv},-96`, col) + gPaw(47 + wv, -99, cuff), front: gArm('M-22,-66 Q-33,-52 -31,-40', col) + gPaw(-31, -36, cuff) };
return { back: '', front: gArm('M-22,-66 Q-33,-52 -31,-40', col) + gArm('M22,-66 Q33,-52 31,-40', col) + gPaw(-31, -36, cuff) + gPaw(31, -36, cuff) };
}
function hanbokGom(x, y, o = {}) {
const s = o.s || 1, C = OBANG[o.c || 'blue'], T = o.T || 0, isW = o.c === 'white', isB = o.c === 'black';
const line = isB ? '#0E0E12' : G_OUT;
let g = `<g transform="translate(${x},${y}) scale(${s})">`;
if (o.shadow !== false) g += `<ellipse cx="0" cy="2" rx="28" ry="6" fill="rgba(0,0,0,0.13)"/>`;
g += `<ellipse cx="-12" cy="-4" rx="10" ry="5" fill="${G_TAN}" stroke="${G_OUT}" stroke-width="${G_SW}"/><ellipse cx="12" cy="-4" rx="10" ry="5" fill="${G_TAN}" stroke="${G_OUT}" stroke-width="${G_SW}"/>`;
const A = gomArms(o.arms || 'down', C.robe, G_TAN, T);
g += A.back;
g += `<path d="M-19,-76 C-27,-60 -34,-30 -33,-8 Q0,-3 33,-8 C34,-30 27,-60 19,-76 Q0,-80 -19,-76Z" fill="${C.robe}" stroke="${line}" stroke-width="${G_SW}"/>`;
if (isW) g += `<path d="M-30,-20 Q0,-15 30,-20" stroke="#E6E0D0" stroke-width="2" fill="none"/>`;
