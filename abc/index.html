:root{--paper:#FBF7EE;--rule:#EFE6D5;--margin:#F0B7A4;--ink:#2B3A5C;--ink2:#5A6683;--card:#FFFDF8;--edge:#DCCFB8;--edge2:#EEE4D2;--acc:#E2683C;--acc2:#C8562F;--ok:#3E9B6E;--bad:#D9483B;--gold:#F5B82E;--soft:#7A705F;--faint:#9A8F7C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;background:var(--paper)}
body{background-image:repeating-linear-gradient(var(--paper) 0 27px,var(--rule) 27px 28px)}
body::before{content:'';position:fixed;left:max(14px,env(safe-area-inset-left));top:0;bottom:0;width:1.5px;background:var(--margin);pointer-events:none}
.te{font-family:'Mandali',sans-serif}
#app{position:fixed;inset:0;padding:max(10px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) calc(max(14px,env(safe-area-inset-left)) + 14px);display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.btn{background:var(--ink);color:#fff;border-radius:14px;min-height:40px;padding:0 16px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #18223A;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active,.pill:active,.opt:active{transform:translateY(2px)}
.btn.acc{background:var(--acc);box-shadow:0 3px 0 #A84220}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--edge);box-shadow:0 2px 0 var(--edge2)}
.pill{font-size:13px;font-weight:700;min-height:32px;padding:0 12px;border-radius:99px;border:1.5px solid var(--edge);background:var(--card);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.card{background:var(--card);border-radius:18px;border:1px solid var(--edge2);box-shadow:0 1px 0 #E6DCC8,0 6px 18px rgba(80,55,20,.07)}
.note{font-size:12px;color:var(--soft);line-height:1.45}

.bar{display:flex;align-items:center;gap:10px;min-height:34px}
.ttl{font-size:19px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .te{color:var(--acc);margin-left:4px}
.back{font-weight:800;font-size:15px;white-space:nowrap}
.back .te{color:var(--acc);margin-left:4px} 
.prog{flex:1;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--soft);min-width:60px;white-space:nowrap}
.prog .tr{flex:1;height:7px;border-radius:9px;background:#EDE3D0;overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--acc);border-radius:9px}

.home{flex:1;display:grid;gap:12px;min-height:0}
@media (orientation:landscape){.home{grid-template-columns:250px 1fr}}
@media (orientation:portrait){.home{grid-template-rows:auto 1fr}}
.today{padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}

.tile{border:1.5px solid var(--edge);border-radius:14px;background:#fff;padding:8px 12px;display:flex;flex-direction:column;gap:4px;text-align:left}
.tile small{font-size:12px;font-weight:800;color:var(--acc)}
.tile .bx{font-size:13px;font-weight:800;color:var(--soft)}
.tile .big{display:flex;align-items:center;gap:10px}
.tile .big .te{font-size:46px;line-height:1}
.tile .btn{width:100%}
.tile .st{font-size:14px;font-weight:700}
.tile .st b{color:var(--bad)}
.btn.dim{opacity:.45}
.rd b{display:block;font-size:24px;font-weight:800;line-height:1.15}
.sub{display:flex;gap:6px}
.sub .pill{flex:1;justify-content:center;border-radius:12px;min-height:36px}
.tbl{padding:6px 10px;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-wrap:wrap;gap:4px 12px;align-content:flex-start}
.grp{display:flex;flex-direction:column}
.grp.lk .gc{opacity:.55}
.sech{width:100%;font-size:12px;font-weight:800;color:var(--acc);margin-top:4px}
.gh{font-size:11px;font-weight:700;color:var(--soft);display:flex;gap:4px;align-items:baseline;margin-bottom:1px;white-space:nowrap}
.gh b{color:var(--ink)} .gh span{margin-left:6px;font-weight:600}
.gc{display:flex;border:1.5px solid #C9B99C;border-radius:6px;overflow:hidden;background:#fff}
.c{width:35px;height:36px;border-right:1px solid #E3D7C1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.c:last-child{border-right:0}
.c .te{font-size:20px;line-height:1}
.c i{font-style:normal;font-size:8.5px;color:var(--faint)}
.c.dn::after{content:'';position:absolute;right:2px;top:2px;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--bad);background:rgba(217,72,59,.15)}
.c.n2::after{background:var(--bad)}
.c.nx{background:#FFF1DE;box-shadow:inset 0 0 0 2px var(--acc)}
.a2hs{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:13px;z-index:7;max-width:92vw}

.learn{flex:1;display:grid;gap:14px;min-height:0}
@media (orientation:landscape){.learn{grid-template-columns:auto 1fr}}
@media (orientation:portrait){.learn{grid-template-rows:auto 1fr}}
.pad{position:relative;background:var(--card);border-radius:16px;border:1.5px solid #D9CCB3;box-shadow:0 6px 18px rgba(80,55,20,.07);touch-action:none;aspect-ratio:1/1;align-self:center;justify-self:center}
@media (orientation:landscape){.pad{height:100%;max-height:calc(100vh - 64px);width:auto}}
@media (orientation:portrait){.pad{width:100%;max-width:calc(100vh - 360px)}}
.pad svg{width:100%;height:100%;display:block}
.side{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0;overflow:auto}
.lc{padding:10px 14px;display:flex;align-items:center;gap:14px}
.lc .te{font-size:64px;line-height:1}
.snd{margin-left:auto;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--edge);background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.snd.off{opacity:.4}
.hg{font-size:20px;font-weight:800;color:var(--ink2);position:relative;display:inline-block}
.hg sup{font-size:.55em}
.dt{position:relative;display:inline-block}
.dt::after{content:'';position:absolute;left:50%;bottom:-5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:currentColor}
.steps{padding:9px 14px}
.sp{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap}
.sp i{font-style:normal;width:28px;height:28px;border-radius:50%;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;font-weight:800;background:#fff;font-size:13px}
.sp i.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sp i.on{border-color:var(--acc);color:var(--acc)}
.wd{padding:9px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.wd .te{line-height:1;white-space:nowrap}
.wds{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.wds .wd:only-child .te{font-size:34px}.wds .wd:not(:only-child){gap:9px;padding:8px 10px}.wds .wd:not(:only-child) .te{font-size:26px}
.wd b{font-size:15px} .wd .hg{font-size:15px} .wd p{margin:2px 0 0;font-size:13px;color:var(--soft)}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links .pill{text-decoration:none;color:var(--ink)}
.links .te{font-size:15px}
.tfoot{width:100%;display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.tfoot .pill{font-size:12px;min-height:28px;color:var(--soft)}
.hl{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));align-content:start}
.hl .card{padding:10px 14px}
.hl h3{margin:0 0 6px;font-size:13px;color:var(--acc)}
.hl a{display:block;padding:7px 0;border-top:1px dashed var(--edge2);color:var(--ink);text-decoration:none;font-size:14px;font-weight:700}
.hl a:first-of-type{border-top:0}
.hl a small{display:block;font-weight:500;color:var(--soft);font-size:12px}
.ph{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-content:start}
.ph .pc{text-align:left;padding:9px 12px 9px 14px;display:flex;gap:8px;align-items:center}
.ph .pc>div:first-child{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.pb{display:flex;flex-direction:column;gap:6px}.pb .snd{width:42px;height:42px;font-size:17px;margin:0}
.ph .te{font-size:22px;line-height:1.35}
.ph b{font-size:13px;color:var(--ink2)} .ph .hg{font-size:13px} .ph p{margin:0;font-size:13px;color:var(--soft)}
.ph h3{grid-column:1/-1;margin:4px 0 0;font-size:13px;color:var(--acc)}
.hold{position:relative;overflow:hidden}.tfoot .hold{border-color:#E8B4AE;color:var(--bad)}
.hold span{position:relative}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(217,72,59,.18)}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot .note{color:var(--faint)}

.qwrap{flex:1;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;min-height:0}
.qdots{display:flex;gap:6px}
.qdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--edge);background:#fff}
.qdots i.ok{background:var(--ok);border-color:var(--ok)}.qdots i.bad{background:var(--bad);border-color:var(--bad)}.qdots i.on{border-color:var(--acc)}
.qq{font-size:19px;font-weight:800;text-align:center}
.qq .te{font-size:82px;line-height:1.1;display:block}
.qq .rd b{font-size:30px}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(100%,720px)}
@media (orientation:portrait){.opts{grid-template-columns:repeat(2,1fr)}}
.opt{background:var(--card);border:1.5px solid var(--edge);border-radius:18px;padding:10px 6px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 var(--edge2)}
.opt .te{font-size:46px;line-height:1}
.opt b{font-size:17px}
.opt.ok{border-color:var(--ok);background:#E6F5EC}.opt.bad{border-color:var(--bad);background:#FBE9E7}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:15px;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.stamp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(251,247,238,.85);z-index:8}

else { if (pool.length < 2) return toast(t('nothing')); const pick = byNeed(pool).slice(0, 8); qs = shuffle(pick).map((c, i) => { let k = 1 + (i % 3); if (k === 3 && !sims(c).length) k = 1; return makeQ(c, k, allPool()); }); }
go('quiz', {mode, arg, qs, i: 0, res: [], pick: null});
}
function allPool() { const mx = Math.max(1, ...learned().map(c => BY[c].b), P.c ? BY[P.c].b : 1); const p = L.filter(l => l.b <= mx).map(l => l.c); return p.length >= 4 ? p : L.map(l => l.c); }
function quiz() {
const q = P.qs[P.i]; const l = BY[q.c];
const title = P.mode === 'letter' ? t('letterQuiz') : P.mode === 'box' ? `${t('boxQuiz')} · ${t('unit')} ${P.arg}` : t('quiz');
const done = P.res.filter(x => x != null).length;
let h = topbar(title, progBar(done, P.qs.length, `${Math.min(P.i + 1, P.qs.length)} / ${P.qs.length}`)) + `<div class="qwrap"><div class="qdots">${P.qs.map((_, i) => `<i class="${P.res[i] === true ? 'ok' : P.res[i] === false ? 'bad' : i === P.i ? 'on' : ''}"></i>`).join('')}</div>`;
if (q.kind === 1) h += `<div class="qq">${t('q1')}<span class="te">${q.c}</span></div>`;
else h += `<div class="qq">${t(q.kind === 2 ? 'q2' : 'q3')}<div style="margin-top:10px">${reading(l)}</div></div>`;
h += `<div class="opts">${q.opts.map((o, k) => { const ol = BY[o]; let cls = ''; if (P.pick != null) { if (o === q.c) cls = ' ok'; else if (k === P.pick) cls = ' bad'; } return `<button class="opt${cls}" onclick="answer(${k})">${q.kind === 1 ? readingS(ol) : `<span class="te">${o}</span>`}</button>`; }).join('')}</div>`;
if (P.pick != null) h += `<div class="row"><b style="color:${P.res[P.i] ? 'var(--ok)' : 'var(--bad)'}">${P.res[P.i] ? t('right') : t('wrong') + ': '}</b>${P.res[P.i] ? '' : `<span class="te" style="font-size:34px">${q.c}</span> ${readingS(l)}`}<button class="pill" onclick="say('${q.c}')">🔊</button><button class="btn acc" onclick="nextQ()">${t('next')} ›</button></div>`;
h += `</div>`; $app.innerHTML = h;
}
function answer(k) {
if (P.pick != null) return; const q = P.qs[P.i]; P.pick = k; const ok = q.opts[k] === q.c; P.res[P.i] = ok; seeIt(q.c);
if (ok) { SND.ok(); buzz(12); if (SV.miss[q.c]) SV.miss[q.c]--; } else { SND.bad(); buzz([20, 40, 20]); SV.miss[q.c] = (SV.miss[q.c] || 0) + 1; }
save(); quiz(); if (ok) setTimeout(() => { if (P.sc === 'quiz' && P.pick === k && P.qs[P.i] === q) nextQ(); }, 800);
}
function nextQ() {
if (P.i < P.qs.length - 1) { P.i++; P.pick = null; return quiz(); }
SND.done();
if (P.mode === 'letter') { const c = P.arg; SV.cs[c] = (SV.cs[c] || 0) + 1; save(); return showStamp(c, () => afterLetter(c)); }
if (P.mode === 'box') SV.bq[P.arg] = (SV.bq[P.arg] || 0) + 1;
save(); toast(t('qDone')); go('home');
}

function bindHold() {
const b = document.getElementById('hold'); if (!b) return; const bar = b.querySelector('i'); let t0 = 0, raf = 0;
const stop = () => { cancelAnimationFrame(raf); t0 = 0; bar.style.width = '0'; };
const step = () => { const k = Math.min(1, (performance.now() - t0) / 2000); bar.style.width = (k * 100) + '%'; if (k < 1) raf = requestAnimationFrame(step); else { stop(); const keep = {lang: SV.lang, mute: SV.mute, a2hs: SV.a2hs}; try { localStorage.removeItem(SKEY); } catch (e) {} SV = Object.assign({lang:'ko', cs:{}, open:1, openDay:'', bq:{}, miss:{}, mute:false, introDay:'', streak:{d:0, n:0}, seen:{}, a2hs:false}, keep); save(); SND.bad(); buzz(60); toast(t('resetDone')); go('home'); } };
b.addEventListener('pointerdown', e => { e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(step); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
b.addEventListener('contextmenu', e => e.preventDefault());
}
