<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0B1120; }
body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; color: #F3F5FA; }
#stage { position: absolute; left: 0; top: 0; width: 1180px; height: 820px; transform-origin: 0 0; overflow: hidden;
  background: radial-gradient(ellipse at 50% 38%, #16213D 0%, #0B1120 72%); }
.ab { position: absolute; }
.mist { color: #8F9AB5; }
.scr { position: absolute; inset: 0; display: none; }
.scr.on { display: block; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }


#sky { position: absolute; inset: 0; pointer-events: none; }
#sky .tw1 { animation: tw 3.1s ease-in-out infinite; }
#sky .tw2 { animation: tw 4.7s ease-in-out 1.2s infinite; }
#sky .tw3 { animation: tw 2.3s ease-in-out .6s infinite; }
@keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
.shoot { position: absolute; width: 120px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(243,245,250,0), #F3F5FA);
  transform: rotate(-24deg); opacity: 0; animation: shoot 11s linear infinite; }
@keyframes shoot { 0% { opacity: 0; translate: 0 0; } 2% { opacity: 1; } 7% { opacity: 0; translate: 380px 170px; } 100% { opacity: 0; translate: 380px 170px; } }


#title { left: 40px; top: 22px; display: flex; align-items: center; gap: 14px; }
#title img { height: 64px; }
#title b { font-size: 40px; font-weight: 900; letter-spacing: 2px; }
#trip { right: 36px; top: 28px; text-align: right; font-size: 18px; line-height: 30px; }
#map { left: 0; top: 0; width: 1180px; height: 580px; }
.pl { position: absolute; transform: translate(-50%, -50%); }
.plname { position: absolute; width: 90px; margin-left: -45px; text-align: center; font-size: 15px; color: #8F9AB5; }
.plname.done { color: #F3F5FA; }
#belt circle { animation: tw 2.6s ease-in-out infinite; }
#belt .b2 { animation-delay: 1.3s; }
#rocket { position: absolute; width: 104px; transform: translate(-92%, -78%) rotate(-12deg); transition: left 1.8s cubic-bezier(.45,0,.3,1), top 1.8s cubic-bezier(.45,0,.3,1); z-index: 3; }
.card { position: absolute; top: 590px; width: 260px; height: 190px; border-radius: 22px; background: rgba(22,33,61,.85); border: 2px solid #26365C; text-align: left; }
.card:hover, .card.sel { border-color: #4F8DFF; }
.card .t { position: absolute; left: 20px; top: 22px; font-size: 30px; font-weight: 700; }
.card .s { position: absolute; left: 20px; top: 70px; font-size: 17px; color: #8F9AB5; }
.card .r { position: absolute; left: 20px; top: 142px; font-size: 16px; color: #9BC0FF; }
.card .r.none { color: #8F9AB5; }
.card .k { position: absolute; right: 16px; top: 18px; width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid #34466F; font-size: 16px; line-height: 27px; text-align: center; color: #8F9AB5; }
.card img { position: absolute; }
#snd { left: 40px; top: 540px; font-size: 15px; color: #8F9AB5; padding: 6px 10px; border-radius: 10px; border: 1.5px solid #26365C; }
#nokb { left: 0; width: 1180px; top: 800px; text-align: center; font-size: 13px; color: #5D6A88; }


#pick { background: rgba(11,17,32,.82); z-index: 10; }
#pickBox { left: 190px; top: 90px; width: 800px; height: 640px; border-radius: 26px; background: #121B33; border: 2px solid #26365C; }
#pickTitle { left: 36px; top: 26px; font-size: 32px; font-weight: 700; }
#pickClose { right: 26px; top: 26px; font-size: 18px; color: #8F9AB5; padding: 6px 12px; border: 1.5px solid #26365C; border-radius: 10px; }
#pickList { left: 36px; top: 96px; right: 36px; bottom: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; }
.pi { position: relative; height: 96px; border-radius: 18px; background: #16213D; border: 2px solid #26365C; text-align: left; padding: 16px 20px 0 64px; }
.pi:hover, .pi.sel { border-color: #4F8DFF; }
.pi .n { position: absolute; left: 18px; top: 28px; width: 32px; height: 32px; border-radius: 9px; background: #1D2A4A; text-align: center; line-height: 32px; font-size: 17px; color: #9BC0FF; }
.pi .a { font-size: 23px; font-weight: 700; }
.pi .b { font-size: 15px; color: #8F9AB5; margin-top: 6px; }
.pi .c { position: absolute; right: 16px; top: 16px; font-size: 14px; color: #9BC0FF; }


#back { left: 26px; top: 22px; font-size: 19px; color: #8F9AB5; padding: 4px 8px; }
#ptitle { left: 170px; top: 16px; font-size: 30px; font-weight: 700; white-space: nowrap; }
#ptitle span { font-size: 20px; font-weight: 400; color: #8F9AB5; }
#stats { right: 150px; top: 14px; display: flex; gap: 28px; text-align: center; }
#stats .h { font-size: 14px; color: #8F9AB5; }
#stats .v { font-size: 28px; font-weight: 700; min-width: 64px; }
#nextpl { right: 34px; top: 12px; width: 92px; text-align: center; }
#nextpl img { height: 60px; max-width: 92px; }
#nextpl div { font-size: 13px; color: #8F9AB5; margin-top: 2px; }
#bar { left: 120px; top: 120px; width: 940px; height: 6px; border-radius: 3px; background: #1D2A4A; }
#bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: #4F8DFF; transition: width .2s; }
#area { left: 0; top: 136px; width: 1180px; height: 300px; }
.tile { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #16213D; border: 3px solid #26365C; font-weight: 700; color: #F3F5FA; transition: all .12s; }
.tile.done { color: #8F9AB5; border-color: #2E4170; }
.tile.bad { color: #FF5A6A; border-color: #FF5A6A; }
.tile.cur { border-color: #4F8DFF; box-shadow: 0 0 28px #4F8DFF; }
.oops { position: absolute; width: 120px; text-align: center; font-size: 15px; color: #FF5A6A; }
#hint { left: 0; width: 1180px; top: 296px; text-align: center; font-size: 21px; }
.done1 { position: absolute; left: 140px; font-size: 19px; color: #8F9AB5; white-space: nowrap; overflow: hidden; width: 900px; }
.box { position: absolute; left: 120px; width: 940px; border-radius: 20px; background: rgba(22,33,61,.85); border: 2px solid #26365C; }
.tgt, .typ { position: absolute; left: 160px; white-space: pre; letter-spacing: 1px; }
.typ { color: #9BC0FF; }
.typ .w { color: #FF5A6A; text-decoration: underline; text-underline-offset: 6px; }
.typ .cur { display: inline-block; width: 3px; background: #4F8DFF; vertical-align: -6px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.nxt { position: absolute; left: 140px; font-size: 19px; color: #8F9AB5; opacity: .75; white-space: nowrap; }
.enter { position: absolute; right: 140px; font-size: 15px; color: #6EE7A8; }
#kb { left: 0; top: 440px; width: 1180px; height: 380px; }
.key { position: absolute; border-radius: 12px; background: #16213D; border: 2px solid #26365C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 26px; color: #F3F5FA; }
.key .sh { position: absolute; left: 7px; top: 3px; font-size: 13px; font-weight: 400; color: #8F9AB5; }
.key .fl { position: absolute; left: 10px; right: 10px; bottom: 6px; height: 4px; border-radius: 2px; opacity: .7; }
.key .home { position: absolute; left: 50%; margin-left: -4px; bottom: 14px; width: 8px; height: 3px; border-radius: 2px; background: #8F9AB5; }
.key.on { background: #4F8DFF; border-color: #9BC0FF; box-shadow: 0 0 24px #4F8DFF; color: #fff; }
.key.on .fl { opacity: 1; }
.key.hit { background: #2E4170; }
.key.small { font-size: 16px; font-weight: 400; }
#boy { right: 22px; bottom: 18px; width: 100px; height: 150px; }
#boy img { position: absolute; right: 0; bottom: 0; max-width: 100px; max-height: 150px; }


#res { background: rgba(11,17,32,.78); z-index: 10; }
#resBox { left: 290px; top: 150px; width: 600px; height: 500px; border-radius: 26px; background: #121B33; border: 2px solid #4F8DFF; text-align: center; }
#resT { position: absolute; left: 0; right: 0; top: 34px; font-size: 32px; font-weight: 800; }
#resS { position: absolute; left: 0; right: 0; top: 86px; font-size: 18px; color: #8F9AB5; }
#resN { position: absolute; left: 60px; right: 60px; top: 140px; display: flex; justify-content: space-around; }
#resN .h { font-size: 15px; color: #8F9AB5; }
#resN .v { font-size: 46px; font-weight: 800; }
#resBest { position: absolute; left: 0; right: 0; top: 262px; font-size: 19px; color: #FFC53D; }
#resBoy { position: absolute; left: 50%; top: 298px; height: 100px; transform: translateX(-50%); }
#resBtns { position: absolute; left: 40px; right: 40px; bottom: 34px; display: flex; gap: 16px; justify-content: center; }
#resBtns button { min-width: 160px; height: 58px; border-radius: 16px; border: 2px solid #26365C; background: #16213D; font-size: 20px; font-weight: 700; }
#resBtns button.main { background: #4F8DFF; border-color: #9BC0FF; }
#resBtns small { display: block; font-size: 12px; font-weight: 400; opacity: .7; }
</style></head>

  <button class="ab" id="snd" onclick="toggleSnd()"></button><div id="cards"></div>

<section class="scr" id="res"><div class="ab" id="resBox"><div id="resT"></div><div id="resS"></div><div id="resN"></div><div id="resBest"></div><img id="resBoy"><div id="resBtns"></div></div></section>
